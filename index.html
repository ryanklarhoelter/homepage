    <script>
      (function () {
        var hasMatchMedia = typeof window.matchMedia === "function";
        var darkQuery = hasMatchMedia
          ? window.matchMedia("(prefers-color-scheme: dark)")
          : null;
        var lightQuery = hasMatchMedia
          ? window.matchMedia("(prefers-color-scheme: light)")
          : null;
        function isDark() {
          if (darkQuery && darkQuery.matches) {
            return true;
          }
          if (lightQuery && lightQuery.matches) {
            return false;
          }
          var hour = new Date().getHours();
          return hour >= 19 || hour < 7;
        }
        function apply() {
          document.documentElement.classList.toggle("dark", isDark());
        }
        apply();
        if (darkQuery && darkQuery.addEventListener) {
          darkQuery.addEventListener("change", apply);
        }
        setInterval(apply, 60000);
      })();
    </script>

    <link href="normalize.css" rel="stylesheet" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #0f0f0f;
        --link: #3572b0;
        --visited: #5c9fad;
        --rule: lightgray;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --text: #e6e6e6;
          --link: #7fb0e6;
          --visited: #8cc5d1;
          --rule: #444;
          color-scheme: dark;
        }
      }

      :root.dark {

        --text: #e6e6e6;
        --link: #7fb0e6;
        --visited: #8cc5d1;
        --rule: #444;
        color-scheme: dark;
      }

      html {

      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: Arial;
        line-height: 1.6;
        margin-left: auto;
        margin-right: auto;
        max-width: 30em;
        padding: 2em 1.5em;
      }

      h1,

        line-height: 1.2;
      }

      h1 a:link,
      h2 a:link,
      h1 a:visited,
      h2 a:visited {
        color: var(--text);
      }

      a:link {
        color: var(--link);
      }

      a:visited {
        color: var(--visited);
      }

      img {
        border-radius: 1%;
        display: block;
        height: auto;
        margin-bottom: 2em;
        margin-top: 2em;
        max-width: 100%;
        width: 100%;
      }

      body img:first-of-type {

      }

      hr {
        background-color: var(--rule);
        border: none;
        height: 1px;
      }

      .u-font-style-italic {
        font-style: italic !important;
      }

      .u-margin-top-2em {
        margin-top: 2em !important;
      }
    </style>
